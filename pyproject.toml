[project]
name = "gassi"
version = "0.6.2"
description = "Hybrid AI Gaming Assistant — game-specific strategy advisor via screen capture and AI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
authors = [
    { name = "ViTec", email = "your@email.com" },
]

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "keyring>=25.5",
    "mss>=9.0",
    "Pillow>=11.0",
    "opencv-python-headless>=4.10",
    "rapidocr-onnxruntime>=1.4",
    "google-genai>=1.0",
    "pynput>=1.7",
    "edge-tts>=7.0",
    "numpy>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyinstaller>=6.11",
]
windows = [
    "pywin32>=306",
]
rag = [
    # Local vector DB + embedding model for game knowledge retrieval (v0.6.x).
    # Not installed by default — only needed when game packs ship a rag/ collection.
    # Install with: uv sync --extra rag
    "chromadb>=0.6",
    "sentence-transformers>=3.0",
]

[project.scripts]
gassi = "gassi.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gassi"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
