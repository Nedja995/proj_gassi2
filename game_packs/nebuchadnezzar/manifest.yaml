# HUD regions estimated from 1456x816 reference screenshots.
# IMPORTANT: these are first estimates — run auto-calibration (Settings → Calibrate HUD)
# on your actual resolution before relying on OCR advisor.
# All fractions are relative to full primary monitor dimensions.

hud_regions:
  - label: "resource_bar"
    # Top-center strip: resource category icons with stock counts
    # e.g. "13 · 2 · 8 · 0 · 34 · 0 · 22 · 28" (food, materials, goods, etc.)
    # Narrow band — needs 3x upscale and adaptive threshold in preprocessor
    x_pct: 0.28
    y_pct: 0.0
    width_pct: 0.44
    height_pct: 0.028

  - label: "status_bar"
    # Below resource icons: treasury | month | approval% | unemployment% | population
    # e.g. "2,843 | August | 22%(-540) | 0%(0) | 2,460"
    # Cleaner font than resource_bar — higher expected OCR confidence
    x_pct: 0.28
    y_pct: 0.028
    width_pct: 0.44
    height_pct: 0.032

  - label: "objectives"
    # Top-right panel: mission targets — Population x/y, Money x/y, Prestige x/y,
    # house level targets. White text on dark background, most readable region.
    x_pct: 0.78
    y_pct: 0.0
    width_pct: 0.22
    height_pct: 0.12
