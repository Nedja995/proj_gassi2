game_id: nebuchadnezzar
display_name: "Nebuchadnezzar"
window_title_pattern: "Nebuchadnezzar"
game_version: "1.0"
rag_collection_name: nebuchadnezzar_knowledge
rag_top_k: 4
rag_min_game_version: "1.0"

# OCR regions are unreliable until calibration is refined;
# screenshot mode gives better advice for mid/late game.
# Override per-session via Shift+F1.
preferred_advisor_source: "screenshot"

# v0.6.0: building footprint registry (planned)
# building_footprints:
#   shrine: [2, 2]        # small shrine (fits 2x2 tiles)
#   temple: [4, 4]        # standard temple
#   ziggurat: [6, 6]      # monument-scale
#   bazaar: [2, 2]
#   granary: [2, 2]
#   storehouse: [2, 2]

quick_prompts:
  - "Where should I place the Temple to cover the most housing blocks?"
  - "Where is the best central spot for a new Bazaar to reach all housing?"
  - "Where should I place the next Granary closest to both farms and bazaar?"
  - "Where should I expand my housing block next for maximum road access?"
  - "Where should I place a Well to cover the most unserved housing tiles?"

# HUD regions estimated from 1456x816 reference screenshots.
# IMPORTANT: these are first estimates — run auto-calibration (Settings → Calibrate HUD)
# on your actual resolution before relying on OCR advisor.
# All fractions are relative to full primary monitor dimensions.

hud_regions:
  - label: "resource_bar"
    # Top-center strip: resource category icons with stock counts
    # e.g. "13 · 2 · 8 · 0 · 34 · 0 · 22 · 28" (food, materials, goods, etc.)
    # Narrow band — needs 3x upscale and adaptive threshold in preprocessor
    x_pct: 0.28
    y_pct: 0.0
    width_pct: 0.44
    height_pct: 0.028

  - label: "status_bar"
    # Below resource icons: treasury | month | approval% | unemployment% | population
    # e.g. "2,843 | August | 22%(-540) | 0%(0) | 2,460"
    # Cleaner font than resource_bar — higher expected OCR confidence
    x_pct: 0.28
    y_pct: 0.028
    width_pct: 0.44
    height_pct: 0.032

  - label: "objectives"
    # Top-right panel: mission targets — Population x/y, Money x/y, Prestige x/y,
    # house level targets. White text on dark background, most readable region.
    # Corrected manually: calibration placed this at x=0.43 (city name area).
    x_pct: 0.838
    y_pct: 0.028
    width_pct: 0.155
    height_pct: 0.133
