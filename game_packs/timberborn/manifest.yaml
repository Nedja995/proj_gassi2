game_id: timberborn
display_name: "Timberborn"
window_title_pattern: "Timberborn"
game_version: "0.6"
rag_collection_name: timberborn_knowledge
rag_top_k: 4
rag_min_game_version: "0.6"

# v0.7.4: building footprint registry (width_cells x height_cells).
# Keys are lowercase keywords matched against placement advice text.
# Footprint expands the highlight box to cover the full building area.
building_footprints:
  pump: [1, 1]           # water pump (1 tile)
  floodgate: [1, 1]      # floodgate (1 tile)
  dam: [1, 1]            # dam segment (1 tile)
  forester: [3, 3]       # forester's hut (3x3)
  lumberjack: [2, 2]     # lumberjack flag (2x2)
  sawmill: [3, 2]        # sawmill (3x2)
  farm: [4, 3]           # farmhouse (4x3)
  farmhouse: [4, 3]      # alternate keyword
  battery: [2, 2]        # mechanical battery (2x2)
  power wheel: [2, 3]    # large power wheel (2x3)
  workshop: [3, 2]       # workshop (3x2)
  warehouse: [4, 2]      # warehouse (4x2)
  district center: [4, 4]  # district center / town hall (4x4)

quick_prompts:
  - "Where should I build my next water pump?"
  - "Where is the best spot for a new dam or floodgate?"
  - "Where should I place my next forester?"
  - "Where can I expand my farm fields?"
  - "Where should I put a mechanical battery for maximum capacity?"

# HUD regions calibrated from 1456x816 screenshots (Cycle 1, day 3).
# Fractions are relative to full captured screen — survive window resize.
# If your resolution differs significantly, use auto-calibration (v0.2.0)
# or re-measure with F4 debug frame + docs/adding_game_pack.md workflow.

hud_regions:
  - label: "top_resource_bar"
    # Top strip: logs, planks, food, water, science counts (left ~37% of screen)
    x_pct: 0.0
    y_pct: 0.0
    width_pct: 0.37
    height_pct: 0.035

  - label: "population_panel"
    # Top-left panel: worker counts, population, wellness, idle beavers
    x_pct: 0.0
    y_pct: 0.033
    width_pct: 0.145
    height_pct: 0.145

  - label: "cycle_time_panel"
    # Top-right: "Cycle X, day Y", time remaining, season/weather strip
    x_pct: 0.78
    y_pct: 0.0
    width_pct: 0.22
    height_pct: 0.035
